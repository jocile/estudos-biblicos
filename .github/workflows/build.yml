name: Check for any build error

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm run --if-present build

      # ─── NOVO ────────────────────────────────────────────────────────────────
      - name: Verificar saída do build
        run: |
          if [ -d out ]; then
            echo "✅ Pasta ./out encontrada"
            ls -la out
          else
            echo "❌ ERRO: ./out não foi criada"
            echo "→ Verifique next.config.ts: output deve ser 'export'"
            exit 1
          fi
      # ─────────────────────────────────────────────────────────────────────────
