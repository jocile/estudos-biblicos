name: Deploy Next.js site to Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v6

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build with Next.js
        run: pnpm run build
        env:
          PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}

      # ─── NOVO ────────────────────────────────────────────────────────────────
      - name: Verificar saída do build
        run: |
          echo "PAGES_BASE_PATH=$PAGES_BASE_PATH"
          echo "--- Conteúdo do diretório raiz ---"
          ls -la
          if [ -d out ]; then
            echo "✅ Pasta ./out encontrada"
            ls -la out
            if [ -f out/index.html ]; then
              echo "✅ index.html presente"
            else
              echo "❌ ERRO: index.html ausente em ./out"
              exit 1
            fi
          else
            echo "❌ ERRO: ./out não foi criada pelo build"
            echo "→ Verifique next.config.ts: output deve ser 'export'"
            exit 1
          fi
        env:
          PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}
      # ─────────────────────────────────────────────────────────────────────────

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 10
          reporting_interval: 5000
